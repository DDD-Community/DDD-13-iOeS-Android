# secrets.properties 템플릿 — 이 파일은 git에 커밋된다(값은 비워둠).
# 실제 키는 루트의 secrets.properties 에 작성한다(.gitignore 처리됨).
# build.gradle.kts 가 secrets.properties 없으면 이 기본값으로 빌드한다.
NAVER_MAP_CLIENT_ID=
KAKAO_NATIVE_APP_KEY=
PICKFLOW_API_BASE_URL=https://pickflow-api.us/api/
# debug 빌드 전용 개발 서버
PICKFLOW_API_BASE_URL_DEV=https://dev-api.pickflow-api.us/api/
# 약관/개인정보 노션 URL 및 공지사항 게시판 마스터 ID — 실제 값은 secrets.properties 에 주입
TERMS_URL=
PRIVACY_URL=
NOTICE_BOARD_MASTER_ID=1
# iOS `AddressService` 1:1 — Kakao Local API REST key (developers.kakao.com). 미설정 시 주소 검색 401.
KAKAO_REST_API_KEY=
# Apple Sign In OAuth (iOS `AppleAuthProvider` 1:1). Service ID + redirect URI.
APPLE_SERVICE_ID=
APPLE_REDIRECT_URI=
# Firebase App Distribution (docs/firebase-distribution.md) — 로컬 배포 시에만 필요.
# FIREBASE_SERVICE_ACCOUNT_FILE 은 서비스 계정 JSON 경로(루트 기준 상대 또는 절대).
FIREBASE_APP_ID=
FIREBASE_SERVICE_ACCOUNT_FILE=
# 로컬 QA 배포 완료 알림용 Discord 웹훅. 비워두면 알림을 건너뛴다(CI 는 설정하지 않는다).
DISCORD_WEBHOOK_URL=
