name: Release AAB (Play 심사용)

# vX.Y.Z 태그 푸시 시 서명된 release AAB 를 빌드해 GitHub Release 에 첨부한다.
# (workflow_dispatch 는 워크플로가 기본 브랜치에 있어야 노출되므로 태그 트리거 사용.)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    name: Build · Sign · Attach AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 비공개 키를 secrets.properties 로 주입(release 빌드에 실제 키 반영).
      - name: Write secrets.properties
        run: |
          cat > secrets.properties <<'EOF'
          NAVER_MAP_CLIENT_ID=${{ secrets.NAVER_MAP_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}
          PICKFLOW_API_BASE_URL=${{ secrets.PICKFLOW_API_BASE_URL }}
          TERMS_URL=${{ secrets.TERMS_URL }}
          PRIVACY_URL=${{ secrets.PRIVACY_URL }}
          NOTICE_BOARD_MASTER_ID=${{ secrets.NOTICE_BOARD_MASTER_ID }}
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          APPLE_SERVICE_ID=${{ secrets.APPLE_SERVICE_ID }}
          APPLE_REDIRECT_URI=${{ secrets.APPLE_REDIRECT_URI }}
          EOF

      # GA(Firebase Analytics) 설정 주입 — google-services.json 은 미추적 시크릿(.gitignore).
      # 시크릿이 비어 있으면 파일을 만들지 않아 google-services 플러그인이 스킵된다(GA 만 비활성).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      # base64 로 보관한 keystore 를 복원.
      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # 태그 vX.Y.Z[-N] → versionName = X.Y.Z (마케팅 버전). -N 은 기록용 빌드 차수.
      # versionCode 는 태그에서 파생하지 않는다 — build.gradle.kts fallback(단조증가, 커밋 관리)이 단일 출처.
      # (버전 규칙 상세: docs/ci-cd.md §버전 규칙)
      - name: Compute VERSION_NAME from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SEMVER="${TAG%%-*}"
          echo "VERSION_NAME=$SEMVER" >> "$GITHUB_ENV"
          echo "versionName=$SEMVER (tag $GITHUB_REF_NAME)"

      - name: Build signed release AAB
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pickflow-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Attach AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
